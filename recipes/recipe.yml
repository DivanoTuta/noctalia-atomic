---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: noctalia-atomic
description: Fedora Atomic personalizada con Niri, Noctalia Shell y Noctalia Greeter sobre uBlue base-main
base-image: ghcr.io/ublue-os/base-main
image-version: latest # Puedes fijarlo a 45 o usar latest

modules:
  - type: dnf
    repos:
      copr:
        - yalter/niri
      files:
        - lionheartp-Hyprland.repo
        - vscode.repo
    install:
      # Evitar que los Recommends de niri instalen utilidades duplicadas o gnome-keyring
      exclude:
        - fuzzel
        - waybar
        - swaylock
        - gnome-keyring
        - gnome-keyring-pam
      packages:
        # Compositor, Shell y Greeter
        - niri
        - noctalia
        - noctalia-greeter-git
        - greetd
        - greetd-selinux
        - accountsservice
        - xwayland-satellite

        # Portales XDG, Llavero (oo7), Polkit y Biometría
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - oo7-daemon
        - oo7-portal
        - pam_oo7
        - mate-polkit
        - seahorse
        - fprintd
        - fprintd-pam

        # Terminal, Shell y Utilidades CLI
        - alacritty
        - fish
        - wl-clipboard
        - btop
        - fastfetch
        - ripgrep
        - jq
        - yq

        # Audio, Brillo, Energía, Sensores, Red e Impresión (control de hardware)
        - playerctl
        - brightnessctl
        - pavucontrol
        - nm-connection-editor
        - nm-connection-editor-desktop
        - blueman
        - power-profiles-daemon
        - upower
        - powertop
        - ddcutil
        - lm_sensors
        - nethogs
        - pciutils
        - usbutils
        - bolt
        - cups
        - cups-filters
        - ipp-usb
        - avahi
        - nss-mdns
        - system-config-printer

        # Gestor de archivos, discos y complementos de Nautilus
        - nautilus
        - nautilus-python
        - blueman-nautilus
        - gnome-disk-utility
        - gparted
        - xhost
        - exfatprogs
        - ntfs-3g
        - ntfsprogs
        - dosfstools
        - sushi
        - ffmpegthumbnailer
        - gvfs-mtp
        - gvfs-smb
        - gvfs-nfs
        - gvfs-gphoto2
        - gvfs-afc
        - 7zip
        - unrar
        - unar
        - unzip

        # Desarrollo y Entornos Inmutables
        - distrobox
        - podman-compose
        - code

        # Gaming y Rendimiento
        - steam
        - steam-devices
        - mangohud

        # Fuentes del sistema, iconos, temas y ofimática
        - papirus-icon-theme
        - adw-gtk3-theme
        - google-noto-sans-cjk-fonts
        - google-noto-emoji-fonts
        - google-carlito-fonts
        - google-crosextra-caladea-fonts
    remove:
      packages:
        - htop

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - |
        nethogs_bin="$(readlink --canonicalize-existing "$(command -v nethogs)")"
        chgrp -- wheel "${nethogs_bin}"
        chmod -- 0750 "${nethogs_bin}"
        setcap 'cap_net_admin,cap_net_raw,cap_dac_read_search,cap_sys_ptrace+pe' "${nethogs_bin}"
      - "authselect enable-feature with-fingerprint"
      - "glib-compile-schemas /usr/share/glib-2.0/schemas"
      - |
        for pam_file in /etc/pam.d/passwd /usr/lib/pam.d/greetd; do
          if [[ -f "${pam_file}" ]] && ! grep --quiet --extended-regexp 'pam_oo7\.so.*use_authtok' "${pam_file}"; then
            printf '\n-password   optional    pam_oo7.so use_authtok\n' >> "${pam_file}"
          fi
        done

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono
        - NerdFontsSymbolsOnly

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.TextEditor
          - org.gnome.Calculator
          - org.gnome.Loupe
          - org.gnome.Papers
          - org.libreoffice.LibreOffice
          - io.github.celluloid_player.Celluloid
          - org.videolan.VLC
          - io.missioncenter.MissionCenter
          - org.gnome.baobab
          - org.gnome.FileRoller
          - io.github.kolunmi.Bazaar
          - io.github.flattool.Warehouse
          - com.github.tchx84.Flatseal
          - io.github.seadve.Kooha

  - type: systemd
    system:
      enabled:
        - accounts-daemon.service
        - avahi-daemon.service
        - bluetooth.service
        - cups.service
        - greetd.service
        - power-profiles-daemon.service
    user:
      enabled:
        - noctalia-first-login.service
        - oo7-daemon.service
      masked:
        - app-blueman@autostart.service
        - org.freedesktop.IBus.session.GNOME.service
        - grub-boot-success.service
        - grub-boot-success.timer

  - type: signing
