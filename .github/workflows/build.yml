name: Build Custom Atomic Image

on:
  push:
    branches:
      - main
    paths:
      - 'recipes/**'
      - 'files/**'
      - 'modules/**'
      - 'cosign.pub'
      - '.editorconfig'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'recipes/**'
      - 'files/**'
      - 'modules/**'
      - 'cosign.pub'
      - '.editorconfig'
      - '.github/workflows/**'
  schedule:
    # Ejecuta una compilación diaria a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Recipe and Scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate shell scripts and desktop entries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shfmt shellcheck desktop-file-utils

          mapfile -d '' shell_scripts < <(find files -type f \( -name '*.sh' -o -name '*.bash' \) -print0)
          if ((${#shell_scripts[@]} > 0)); then
            shfmt -d "${shell_scripts[@]}"
            for script in "${shell_scripts[@]}"; do
              shebang="$(head -n 1 "${script}")"
              if [[ "${shebang}" == *bash* ]]; then
                bash -n "${script}"
                shellcheck --shell=bash --external-sources "${script}"
              else
                sh -n "${script}"
                shellcheck --shell=sh --external-sources "${script}"
              fi
            done
          fi

          mapfile -d '' desktop_files < <(find files -type f -name '*.desktop' -print0)
          if ((${#desktop_files[@]} > 0)); then
            desktop-file-validate "${desktop_files[@]}"
          fi

      - name: Validate Python code (Ruff lint)
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: files

      - name: Check Python formatting (Ruff format)
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check
          src: files

      - name: Set up Python for mypy
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Validate Python typing (mypy)
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir mypy pyyaml
          mapfile -d '' py_files < <(find files -type f -name '*.py' -print0)
          if ((${#py_files[@]} > 0)); then
            mypy --strict --ignore-missing-imports "${py_files[@]}"
          fi

      - name: Validate TOML configuration files
        run: |
          set -euo pipefail
          python3 -c '
          import pathlib, tomllib

          for path in sorted(pathlib.Path("files").rglob("*.toml")):
              with path.open("rb") as handle:
                  tomllib.load(handle)
              print(f"TOML OK: {path}")
          '

      - name: Validate recipe.yml script snippets
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp --directory)"
          trap 'rm --recursive --force -- "${tmp_dir}"' EXIT
          python3 - "${tmp_dir}" <<'PY'
          import pathlib, sys, yaml

          out_dir = pathlib.Path(sys.argv[1])
          with open("recipes/recipe.yml", encoding="utf-8") as handle:
              recipe = yaml.safe_load(handle)
          for mod in recipe.get("modules", []):
              if mod.get("type") == "script":
                  for idx, snippet in enumerate(mod.get("snippets", [])):
                      script_path = out_dir / f"snippet_{idx}.sh"
                      script_path.write_text(
                          f"#!/usr/bin/env bash\nset -euo pipefail\n{snippet}\n",
                          encoding="utf-8",
                      )
          PY
          for snippet_file in "${tmp_dir}"/snippet_*.sh; do
            [[ -f "${snippet_file}" ]] || continue
            bash -n "${snippet_file}"
            shellcheck --shell=bash --external-sources "${snippet_file}"
          done

      - name: Validate BlueBuild recipe
        run: |
          set -euo pipefail
          container_id="$(docker create --pull always ghcr.io/blue-build/cli:latest-installer)"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/out/bluebuild" /tmp/bluebuild
          chmod +x /tmp/bluebuild
          /tmp/bluebuild validate recipes/recipe.yml

  bluebuild:
    name: Build Custom Image
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
