[Unit]
OnFailure=getty@tty1.service
After=plymouth-quit.service

[Service]
# Oculta los mensajes INFO de oo7-daemon-login en tty1 durante la transición de greetd a Niri
Environment=RUST_LOG=oo7_daemon_login=warn
ExecStartPre=-/usr/bin/chcon -R system_u:object_r:xdm_var_lib_t:s0 /var/lib/noctalia-greeter
