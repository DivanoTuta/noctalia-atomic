# noctalia-greeter greeter.toml (declarativo, prioridad sobre sync.toml)
# Diseñado para replicar el aspecto y disposición de la pantalla de bloqueo de Noctalia

[session]
default = "Niri"

[keyboard]
layout = "es"
numlock = true

[appearance]
scheme = "Synced"
hide_logo = true
power_buttons_position = "bottom-right"
scheme_selector_position = "top-right"

[appearance.wallpaper]
blur = 0.48   # Coincide con [lockscreen] blur_intensity de Noctalia
tint = 0.3    # Coincide con [backdrop] tint_intensity de Noctalia

[clock]
enabled = true
position = "top-center"
time_format = "{:%H:%M}"
date_format = "%A, %x"

[auth]
# Permite enviar el campo vacío con Enter para iniciar la autenticación biométrica (fprintd)
allow_empty_password = true
