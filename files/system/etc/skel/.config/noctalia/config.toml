[accessibility]
ui_scale = 1.25

[backdrop]
blur_intensity = 0.48
enabled = true
tint_intensity = 0.3

[bar.default]
background_opacity = 0.6
font_scale = 1.42
font_weight = 600
start = [ "launcher", "wallpaper", "workspaces" ]
thickness = 48
widget_spacing = 8

[calendar]
enabled = true

[control_center]
width = 900

[dock]
active_monitor_only = true
background_opacity = 0.6
enabled = true
icon_shadow = true
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0
    locked_timeout = 30.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.48

[shell]
corner_radius_scale = 0.95
niri_overview_close_on_launch_enabled = true
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

[theme]
mode = "dark"
shell_mode = "dark"
source = "wallpaper"

    [theme.templates]
    enable_builtin_templates = true
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "niri" ]

[wallpaper.default]
path = "/usr/share/backgrounds/noctalia/wallhaven-yqw88g.jpg"

[wallpaper.last]
path = "/usr/share/backgrounds/noctalia/wallhaven-yqw88g.jpg"

[widget.media]
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"
